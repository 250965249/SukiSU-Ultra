name: Auto Sync & Build SukiSU Samsung ksud

# Scheduled upstream sync + Samsung all-KMI LKM build + aarch64 ksud release.
# The released `ksud-sukisu-aarch64` is consumed by GhostSam's auto-build workflow.
on:
  schedule:
    - cron: "0 18 * * *"   # 02:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sukisu-auto-sync-build
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: samsung
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream SukiSU-Ultra main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
          git fetch upstream main
          git merge --no-edit upstream/main
          git push origin HEAD:samsung

  build-lkm:
    needs: sync
    uses: ./.github/workflows/build-lkm.yml

  build-ksuinit:
    needs: sync
    uses: ./.github/workflows/ksuinit.yml

  build-ksud:
    needs: [build-lkm, build-ksuinit]
    uses: ./.github/workflows/ksud.yml
    with:
      target: aarch64-linux-android
      pack_lkm: true
      pack_ksuinit: true

  release:
    needs: build-ksud
    runs-on: ubuntu-latest
    steps:
      - name: Download ksud artifact
        uses: actions/download-artifact@v7
        with:
          name: ksud-aarch64-linux-android
          path: ksud-artifact

      - name: Publish latest-ksud release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ksud="$(find ksud-artifact -type f -name ksud | head -n1)"
          test -n "$ksud"
          cp "$ksud" ksud-sukisu-aarch64
          chmod +x ksud-sukisu-aarch64
          if ! gh release view latest-ksud >/dev/null 2>&1; then
            gh release create latest-ksud --title "SukiSU Samsung ksud (latest)" \
              --notes "Automated Samsung all-KMI build from the samsung branch."
          fi
          gh release upload latest-ksud ksud-sukisu-aarch64 --clobber
